name: Collect jobs

on:
  schedule:
    # Once a day, 00:37 UTC = 6:07 AM India time. The website's morning timer (web/netlify/functions/morning-fetch.mts)
    # starts the run on time; this is the backup, because GitHub's own timer often starts hours late.
    - cron: "37 0 * * *"
  workflow_dispatch:         # the website's "Fetch new jobs" button, or Actions -> Collect jobs -> Run workflow

permissions:
  contents: write            # publish the data branch with the built-in GITHUB_TOKEN (no keys to create)

concurrency:
  group: collect-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get the previous data
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data; then
            git archive FETCH_HEAD | tar -x -C data
          else
            echo "No data branch yet - starting fresh"
          fi

      - name: Skip the backup run if this morning's run already happened
        id: today
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          try:
              updated = json.load(open("data/meta.json")).get("updated", "")
          except (OSError, ValueError):
              updated = ""
          done = updated[:10] == datetime.now(timezone.utc).strftime("%Y-%m-%d")
          print(f"last update: {updated or 'never'} -> {'already ran today, skipping' if done else 'collecting'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"done={'true' if done else 'false'}\n")
          PY

      - name: Collect jobs
        if: steps.today.outputs.done != 'true'
        run: python collector/jobbot.py --config collector/config.json --data data

      - name: Publish to the data branch
        if: steps.today.outputs.done != 'true'
        working-directory: data
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Jobs updated $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data:data
