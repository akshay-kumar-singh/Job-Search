name: Collect jobs

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (00:17, 06:17, 12:17, 18:17 UTC); GitHub sometimes starts it late
  workflow_dispatch:         # run it now: Actions -> Collect jobs -> Run workflow (or "Run now on GitHub" on the website)

permissions:
  contents: write            # publish the data branch with the built-in GITHUB_TOKEN (no keys to create)

concurrency:
  group: collect-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get the previous data
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data; then
            git archive FETCH_HEAD | tar -x -C data
          else
            echo "No data branch yet - starting fresh"
          fi

      - name: Collect jobs
        run: python collector/jobbot.py --config collector/config.json --data data

      - name: Publish to the data branch
        working-directory: data
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Jobs updated $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data:data
