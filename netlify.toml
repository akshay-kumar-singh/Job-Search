# Netlify builds only the web app. The job data is read from GitHub (the `data` branch) when the page loads,
# so new jobs show up without a redeploy.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"
  # Skip the build (it uses up Netlify's free build minutes) for the data branch, which the collector rewrites
  # every few hours, and for commits that change nothing in the web app (collector or README only).
  ignore = "[ \"$BRANCH\" = \"data\" ] || git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "strict-origin-when-cross-origin"
